[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalens"
version = "0.1.0"
description = "A scheduling engine for FastAPI applications: appointments, weekly availability, and public booking."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Maya Morales", email = "aka.mayberries@proton.me" }]

# Pinned exactly: these are the versions the suite runs against, and a
# library that silently upgrades FastAPI underneath its host is not a drop-in
# component. A host must be on the same versions. Move them deliberately, with
# the suite green, never as a side effect of another change.
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "databases==0.9.0",
    "limits==5.8.0",
    "alembic==1.19.1",
    "SQLAlchemy==2.0.52",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "asgi-lifespan==2.1.0",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.12",
]

[tool.hatch.build.targets.wheel]
# The migration scripts are data files, not importable modules, but Alembic
# resolves them by filesystem path off the installed package -- so they have
# to ship inside the wheel. They live under src/kalens, so `packages` already
# includes them; force-including them too adds every file twice, which
# hatchling rejects.
packages = ["src/kalens"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
